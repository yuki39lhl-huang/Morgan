# Clash 配置 - VLESS Reality 多节点 fallback
mode: rule
log-level: info
allow-lan: false

mixed-port: 7890
socks-port: 7891
http-port: 7892

external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
    - 1.1.1.1

