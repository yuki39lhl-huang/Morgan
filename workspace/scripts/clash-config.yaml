# Clash 配置 - 订阅自动拉取（proxy-providers）
# 订阅源统一管理在 workspace/scripts/secrets.json 的 clash_subscription
# 节点文件 sub-nodes.yaml 由 update_clash_nodes.py 自动生成（请勿手改）
# 更新节点：python3 workspace/scripts/update_clash_nodes.py && 重启 clash 或
#   curl -X PUT http://127.0.0.1:9090/providers/proxies/kx-nodes
mode: rule
log-level: info
allow-lan: false

mixed-port: 7890
socks-port: 7891
http-port: 7892

cache-file: "/root/.openclaw/workspace/scripts/cache.db"

external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
    - 1.1.1.1

proxy-providers:
  kx-nodes:
    type: file
    path: "/root/.openclaw/workspace/scripts/sub-nodes.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 60
      timeout: 5

proxy-groups:
  - name: PROXY
    type: fallback
    use:
      - kx-nodes
    url: http://www.gstatic.com/generate_204
    interval: 30
    timeout: 5

  - name: CRYPTO-NEWS
    type: fallback
    use:
      - kx-nodes
    url: https://www.google.com/generate_204
    interval: 60
    timeout: 8

  # 币安主网：直连和美国节点都返回 451，只用韩国/日本节点（10-04 实测均 200）。
  # 实盘 API 白名单要固定 IP；fallback 切节点会换出口 IP，上实盘前要把候选节点 IP 都加白名单或改 select 锁定一个。
  - name: BINANCE
    type: fallback
    use:
      - kx-nodes
    filter: "韩国|日本"
    url: https://fapi.binance.com/fapi/v1/ping
    expected-status: 200
    interval: 120
    timeout: 6

rules:
  # 测试网期货本机可直连。走代理时节点一断，下单和平仓会整段 SSL EOF。
  - DOMAIN-SUFFIX,binancefuture.com,DIRECT
  - DOMAIN,testnet.binancefuture.com,DIRECT
  - DOMAIN-SUFFIX,binance.com,BINANCE
  - DOMAIN-SUFFIX,coindesk.com,CRYPTO-NEWS
  - DOMAIN-SUFFIX,coingecko.com,CRYPTO-NEWS
  - DOMAIN-SUFFIX,api.deepseek.com,DIRECT
  - DOMAIN-SUFFIX,feishu.cn,DIRECT
  - DOMAIN-SUFFIX,larksuite.com,DIRECT
  - DOMAIN-SUFFIX,larkoffice.com,DIRECT
  - DOMAIN-SUFFIX,feishucdn.com,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
